function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showStart(){app.innerHTML='<section class="panel"><h2>Welcome, Scientist.</h2><p>Everyone will investigate real-world reactions, build atom-chip models, and demonstrate how mass is conserved. Your mission is private and self-paced.</p><div class="cards"><div class="card"><strong>01 · Investigate</strong>Calculate mass in a reaction.</div><div class="card"><strong>02 · Build</strong>Use chips to model conserved atoms.</div><div class="card"><strong>03 · Prove</strong>Complete the same final evidence check.</div></div><div class="grid2"><div><label for="nm">Your name</label><input id="nm" type="text" maxlength="60" autocomplete="name" placeholder="First and last name"></div><div><label for="period">Class period</label><select id="period"><option value="">Choose your period</option>'+[1,2,3,4,5,6,7].map(x=>'<option>'+x+'</option>').join('')+'</select></div></div><p class="notice">No timer. You can use the on-screen hints. Answers stay on this device until you download your evidence report; nothing is sent automatically to your teacher.</p><button class="btn" id="start">Begin mission →</button><p id="err" role="alert"></p></section>';document.getElementById('start').onclick=()=>{let n=document.getElementById('nm').value.trim(),p=document.getElementById('period').value;if(!n||!p){document.getElementById('err').textContent='Please enter your name and period.';return;}state.name=n;state.period=p;showDiagnostic();};}

function supportNote(topic){
 if(state.support===0){return topic==='mass'?'<div class="scaffold"><strong>Step-by-step:</strong><ol><li>Find the mass of each reactant.</li><li>Look for the word <b>sealed</b>. Nothing can enter or leave.</li><li>Add the two masses. Write the unit <b>g</b>.</li></ol><p><b>Sentence starter:</b> The products have ___ g because ___ g + ___ g = ___ g.</p></div>':'<div class="scaffold"><strong>Build one step at a time:</strong><p><b>2H₂</b> means TWO groups of H₂. Each group has TWO hydrogen atoms.</p><p>H H &nbsp; + &nbsp; H H &nbsp; = &nbsp; 4 hydrogen atoms</p><p><b>O₂</b> means ONE group of TWO oxygen atoms: O O.</p><p><b>First</b> build the left side. <b>Then</b> copy the same totals on the right.</p></div>';}

}
function adaptiveHint(topic){
 state.hints++;let n=state.hintsByTopic[topic]=(state.hintsByTopic[topic]||0)+1;
 if(topic==='mass'){
  if(state.support===0)return n===1?'Find 24 g and 16 g. What operation combines the two amounts?':n===2?'The container is sealed, so add 24 + 16. You can count up: 24 → 34 → 40.':'24 g + 16 g = 40 g. Explain that the atoms are still present.';

  return n===1?'Think about the system boundary: the beaker is open. Could a gas escape?':'Compare the before and after readings. The difference is the gas that left the scale.';
 }
 if(topic==='build'){
  if(state.support===0)return n===1?'Look at 2H₂: draw TWO pairs of H atoms. How many H chips?':n===2?'Now look at O₂: one pair of O atoms. Make TWO oxygen chips.':'You need H = 4 and O = 2 on EACH side. You may add chips by clicking the Add buttons.';

  return n===1?'Count each element separately. An equal TOTAL of chips is not enough if the elements differ.':'Compare H on left with H on right, and O on left with O on right.';
 }
 return 'Look for matter that entered or left the part being weighed.';
}
function showMass(){state.page='mass';let challenge=state.support===2?{a:150,b:146,q:'An open beaker had 150 g before the reaction and 146 g afterward. How many grams of gas escaped?',ans:4,unit:'g of gas',reason:'Gas left the measured beaker; matter was not destroyed.',pic:4}:state.support===1?{a:24,b:16,q:'In a sealed container, magnesium (24 g) and oxygen (16 g) react completely. Calculate the total product mass.' ,ans:40,unit:'g of products',reason:'All reactant mass becomes product mass.',pic:3}:{a:24,b:16,q:'A closed container has two substances: 24 g of magnesium and 16 g of oxygen. They join to make a new substance. How many grams are there altogether?',ans:40,unit:'g of products',reason:'The mass of all reactants equals the mass of all products.',pic:3};state.massChallenge=challenge;let html='<h2>Mission 1 · Investigate the mass</h2>'+photo(challenge.pic)+'<div class="question"><strong>'+esc(challenge.q)+'</strong>'+supportNote('mass')+'<label for="massnum">Your calculation (number)</label><input type="number" id="massnum" inputmode="numeric" min="0" step="1" placeholder="?"> <span>'+challenge.unit+'</span><label for="masswhy">Explain where the mass goes</label><textarea id="masswhy" placeholder="I know this because..."></textarea><div class="row"><button class="btn secondary" id="masshint">Show a hint</button><button class="btn" id="masscheck">Check my evidence →</button></div><div id="massfb" role="status"></div></div>';shell('Mission 1 / 3',html,19);document.getElementById('masshint').onclick=()=>{document.getElementById('massfb').innerHTML='<div class="hint">'+adaptiveHint('mass')+'</div>';};document.getElementById('masscheck').onclick=()=>{let v=Number(document.getElementById('massnum').value),w=document.getElementById('masswhy').value.trim();state.attempts++;if(!document.getElementById('massnum').value||v!==challenge.ans){document.getElementById('massfb').innerHTML='<div class="feedback bad">Not yet. Check the numbers and use the hint if needed.</div>';return;}if(w.length<12){document.getElementById('massfb').innerHTML='<div class="feedback bad">Your calculation is correct. Add a complete scientific explanation before continuing.</div>';return;}state.responses.push({mission:'Investigate',prompt:challenge.q,answer:v,explanation:w,correct:true});showBuild();};}
function parseFormula(formula){const subs={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};let s=formula.replace(/[₀-₉]/g,c=>subs[c]),out={};let re=/([A-Z][a-z]?)(\d*)/g,m;while((m=re.exec(s))!==null)out[m[1]]=(out[m[1]]||0)+Number(m[2]||1);return out;}
function atomCounts(parts){let out={};parts.forEach(p=>{let a=parseFormula(p.f);Object.keys(a).forEach(k=>out[k]=(out[k]||0)+a[k]*p.c);});return out;}
function chip(atom){return '<span class="atom '+esc(atom)+'" aria-label="'+esc(atom)+' atom">'+esc(atom)+'</span>';}
function showBuild(){state.page='build';state.board={before:[],after:[]};state.selected='H';renderBuild();}
function renderBuild(message=''){let m=MISSIONS[0],target=atomCounts(m.parts);let html='<h2>Mission 2 · Build the atom model</h2><div class="grid2"><div>'+photo(0)+'</div><div><h3>Fuel-cell car reaction</h3><p>Hydrogen and oxygen react to form water. Use atom chips to show that <strong>each element has the same number of atoms before and after.</strong></p>'+supportNote('atoms')+'</div></div><div class="math">2H₂ + O₂ → 2H₂O</div><div class="question"><strong>Step 1:</strong> Read the coefficients and subscripts. <strong>Step 2:</strong> Select an atom, then add chips to each board. <strong>Step 3:</strong> Check your model.</div><div class="palette" role="group" aria-label="Choose an atom">'+m.atoms.map(a=>'<button draggable="true" class="chipButton" data-palette="'+a+'" aria-pressed="'+(state.selected===a)+'">'+chip(a)+' '+a+(state.selected===a?' ✓':'')+'</button>').join('')+'</div><div class="boards">'+['before','after'].map(side=>'<section class="board" data-drop="'+side+'"><h3>'+(side==='before'?'Reactants · Before':'Products · After')+'</h3><div class="chips" aria-label="'+side+' atom chips">'+state.board[side].map((a,i)=>'<button class="atom '+a+'" data-remove="'+side+'" data-index="'+i+'" title="Remove '+a+' chip" aria-label="Remove '+a+' chip">'+a+'</button>').join('')+'</div><div class="stat">'+m.atoms.map(a=>a+': '+state.board[side].filter(v=>v===a).length).join(' · ')+'</div><div class="controls"><button data-add="'+side+'">+ Add selected chip</button><button data-clear="'+side+'">Clear side</button></div></section>').join('')+'</div><div class="row" style="margin-top:15px"><button class="btn secondary" id="buildhint">Show a hint</button><button class="btn" id="buildcheck">Check atom model →</button></div><div id="buildfb" role="status">'+message+'</div>';shell('Mission 2 / 3',html,46,true);app.querySelectorAll('[data-palette]').forEach(b=>{b.onclick=()=>{state.selected=b.dataset.palette;renderBuild();};b.ondragstart=e=>{state.selected=b.dataset.palette;e.dataTransfer.setData('text/plain',state.selected);};});app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state.board[b.dataset.add].push(state.selected);renderBuild();});app.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{state.board[b.dataset.clear]=[];renderBuild();});app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.board[b.dataset.remove].splice(+b.dataset.index,1);renderBuild();});app.querySelectorAll('[data-drop]').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();state.board[el.dataset.drop].push(e.dataTransfer.getData('text/plain')||state.selected);renderBuild();};});document.getElementById('buildhint').onclick=()=>{document.getElementById('buildfb').innerHTML='<div class="hint">'+adaptiveHint('build')+'</div>';};document.getElementById('buildcheck').onclick=()=>{state.attempts++;let ok=['before','after'].every(side=>m.atoms.every(a=>state.board[side].filter(v=>v===a).length===target[a]));if(!ok){document.getElementById('buildfb').innerHTML='<div class="feedback bad">Some atom counts do not match the equation yet. Check coefficients × subscripts, then try again.</div>';return;}state.responses.push({mission:'Build',prompt:m.eq,answer:JSON.stringify({before:state.board.before,after:state.board.after}),correct:true});showExplain();};}
function showExplain(){state.page='explain';let html='<h2>Mission 3 · Prove the law</h2>'+photo(1)+(state.support===0?'<div class="scaffold"><strong>Read:</strong> Rust is made when iron joins with oxygen from the air. The oxygen adds mass. <p><b>Try:</b> 112 g + 48 g = ___ g.</p><p><b>Sentence starter:</b> The chain gains mass because oxygen from ___ joins the iron.</p></div>':state.support===1?'<div class="scaffold"><strong>Remember:</strong> Include oxygen when calculating the total mass of rust.</div>':'<div class="scaffold"><strong>Challenge:</strong> Explain why a scale under the bicycle part can increase even though matter is conserved in the larger system.</div>')+'<p>A rusty bicycle chain gains mass as iron combines with oxygen from the air.</p><div class="math">4Fe + 3O₂ → 2Fe₂O₃</div><div class="question"><strong>Analyze:</strong> A bicycle part contains 112 g of iron. It combines with 48 g of oxygen. What mass of iron oxide forms?<label for="rustmass">Mass of iron oxide (g)</label><input id="rustmass" type="number" min="0" step="1"><label for="rustwhy">Explain why the mass increases without breaking the law</label><textarea id="rustwhy" placeholder="The extra mass comes from..."></textarea><button class="btn" id="rustcheck">Check my reasoning →</button><div id="rustfb" role="status"></div></div>';shell('Mission 3 / 3',html,66);document.getElementById('rustcheck').onclick=()=>{state.attempts++;let v=document.getElementById('rustmass').value,w=document.getElementById('rustwhy').value.trim();if(v!=='160'||w.length<15){document.getElementById('rustfb').innerHTML='<div class="feedback bad">Check that you included oxygen in the total mass and wrote an explanation.</div>';return;}state.responses.push({mission:'Prove',prompt:'Rust mass 112 g Fe + 48 g O',answer:160,explanation:w,correct:true});showFinal();};}
function showFinal(){state.page='final';state.final={};renderFinal();}
function renderFinal(message=''){let html='<h2>Final evidence check</h2><p>Everyone completes these same tasks. Correct calculations and atom counts are required to finish. Your teacher will review your written scientific explanations.</p><div class="question"><strong>LT 1 · Mass calculation</strong><p>A sealed container has 45 g of reactant A and 30 g of reactant B. They react completely. What is the total mass of products?</p><label for="f1">Total mass (g)</label><input id="f1" type="number" min="0" step="1" value="'+esc(state.final.mass??'')+'"><label for="f1why">Explain why</label><textarea id="f1why" placeholder="The total mass is... because...">'+esc(state.final.masswhy??'')+'</textarea></div><div class="question"><strong>LT 2 · Atom model</strong><p>For <strong>2H₂ + O₂ → 2H₂O</strong>, determine the number of atoms of each element on each side.</p><div class="grid2"><div><label for="fh">Hydrogen atoms on each side</label><input id="fh" type="number" min="0" step="1" value="'+esc(state.final.h??'')+'"></div><div><label for="fo">Oxygen atoms on each side</label><input id="fo" type="number" min="0" step="1" value="'+esc(state.final.o??'')+'"></div></div><label for="f2why">Explain how your chip model shows conservation of matter</label><textarea id="f2why" placeholder="My model shows...">'+esc(state.final.atomwhy??'')+'</textarea></div><p class="notice">Your model from Mission 2 is also saved in your evidence report.</p><button class="btn" id="finalcheck">Submit final evidence →</button><div id="finalfb" role="status">'+message+'</div>';shell('Shared mastery check',html,82);document.getElementById('finalcheck').onclick=()=>{state.final={mass:document.getElementById('f1').value,masswhy:document.getElementById('f1why').value.trim(),h:document.getElementById('fh').value,o:document.getElementById('fo').value,atomwhy:document.getElementById('f2why').value.trim()};if(!state.final.mass||!state.final.h||!state.final.o||state.final.masswhy.length<10||state.final.atomwhy.length<10){document.getElementById('finalfb').innerHTML='<div class="feedback bad">Complete every answer and explanation before submitting. Correct numbers are required to unlock the certificate.</div>';return;}state.attempts++;state.checks={massCorrect:Number(state.final.mass)===75,atomCorrect:Number(state.final.h)===4&&Number(state.final.o)===2,massExplanation:state.final.masswhy,atomExplanation:state.final.atomwhy};if(!state.checks.massCorrect||!state.checks.atomCorrect){let msg=[];if(!state.checks.massCorrect)msg.push('LT 1: Recheck the total mass of both reactants in the sealed container.');if(!state.checks.atomCorrect)msg.push('LT 2: Recount atoms using coefficient × subscript for each element.');renderFinal('<div class="feedback bad" role="alert"><strong>Not yet — revise your evidence.</strong><p>'+msg.join('</p><p>')+'</p><p>Your answers are saved. Check them and submit again.</p></div>');return;}showFinish();};}
function csvEscape(s){return '"'+String(s??'').replace(/"/g,'""')+'"';}
function download(name,content,type){const b=new Blob([content],{type});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}

function showFinish(){state.page='finish';let c=state.checks,mastery=(c.massCorrect?1:0)+(c.atomCorrect?1:0),html='<h2>Evidence collected</h2><p>Your responses are ready to download. Your teacher will review your explanations as well as your calculations.</p><div class="cards"><div class="card"><strong>LT 1 · Mass</strong>'+(c.massCorrect?'Correct calculation':'Needs another look')+'</div><div class="card"><strong>LT 2 · Atoms</strong>'+(c.atomCorrect?'Correct atom counts':'Needs another look')+'</div><div class="card"><strong>Evidence</strong>Model + explanations recorded</div></div><div class="row" style="margin-top:18px"><button class="btn" id="dlcsv">Download evidence CSV</button><button class="btn secondary" id="dljson">Download full report JSON</button><button class="btn secondary" id="retry">Review final check</button></div><p class="notice">Submit the CSV or JSON file to your teacher through Canvas. This offline HTML cannot automatically send responses to Canvas or a teacher dashboard.</p><hr><div class="certificate printable" id="certificate"><div class="seal" aria-hidden="true">⚛</div><h2>Science Investigation Certificate</h2><p>This recognizes</p><h2>'+esc(state.name)+'</h2><p>for completing the <strong>You Matter Lab</strong></p><p>Law of Conservation of Matter · Grade 7 Science</p><p class="small">'+new Date().toLocaleDateString()+' · Period '+esc(state.period)+'</p><p class="small">Completion recognizes participation; mastery is determined by teacher review of evidence.</p></div><div class="row noprint" style="margin-top:15px"><button class="btn gold" id="print">Print / Save certificate as PDF</button></div>';shell('Mission complete',html,100);document.getElementById('dlcsv').onclick=()=>{let e=evidence(),heads=['Name','Period','Date','Diagnostic correct / 3','Hints used','Attempts','LT1 calculation correct','LT2 atom counts correct','LT1 final mass answer','LT1 explanation','LT2 H atoms','LT2 O atoms','LT2 explanation','Mission 1 explanation','Mission 3 explanation','Model reactants chips','Model products chips'];let vals=[e.name,e.period,e.date,e.diagnosticCorrect,e.hintsUsed,e.attempts,e.checks.massCorrect,e.checks.atomCorrect,e.final.mass,e.final.masswhy,e.final.h,e.final.o,e.final.atomwhy,e.missionResponses[0]?.explanation,e.missionResponses[2]?.explanation,state.board.before.join(' '),state.board.after.join(' ')];download('You_Matter_Lab_'+state.name.replace(/[^a-z0-9]/gi,'_')+'.csv',heads.map(csvEscape).join(',')+'\r\n'+vals.map(csvEscape).join(',')+'\r\n','text/csv');};document.getElementById('dljson').onclick=()=>download('You_Matter_Lab_'+state.name.replace(/[^a-z0-9]/gi,'_')+'.json',JSON.stringify(evidence(),null,2),'application/json');document.getElementById('retry').onclick=()=>renderFinal();document.getElementById('print').onclick=()=>window.print();}
